# Target industries: already multi-billion-dollar markets that are forecast to
# grow ~4x within a few years (≈ 30%+ CAGR ⇒ 4x in ~5 years), plus halal-economy
# verticals that align with Islamic values.
#
# Figures are third-party analyst forecasts (see `source`) and vary between
# research firms — treat them as directional. `growth_multiple` is derived:
# (1 + cagr) ** years_to_target.
#
# `keywords` drive the rule-based classifier (case-insensitive, word-boundary
# regex fragments). Keep them specific: a generic word like "ai" would match
# everything.

industries:
  ai_agents:
    name: AI agents & workflow automation
    market_usd_bn: 7.84
    market_year: 2025
    target_usd_bn: 52.62
    target_year: 2030
    cagr: 0.463
    source: https://www.marketsandmarkets.com/PressReleases/ai-agents.asp
    keywords: [ai agent, agentic, autonomous agent, ai assistant, copilot, workflow automation,
               llm, gpt wrapper, chatbot, voice agent, ai receptionist, rag, automation platform,
               ai sdr, ai workflow, prompt]

  vertical_ai_saas:
    name: Vertical AI SaaS (industry-specific AI tools)
    market_usd_bn: 94.86
    market_year: 2025
    target_usd_bn: 1423.5
    target_year: 2034
    cagr: 0.365
    source: https://marketintelo.com/report/vertical-ai-saas-platform-market
    keywords: [vertical saas, for contractors, for dentists, for clinics, for restaurants,
               for real estate, for accountants, for plumbers, for salons, for agencies,
               for law firms, for landlords, property management, field service]

  healthcare_ai:

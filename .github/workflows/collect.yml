name: Collect SaaS signals

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (off the :00 rush)
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated subset (hackernews,reddit,devto,producthunt,rss,google_news). Empty = all."
        required: false
        default: ""
      llm:
        description: "Run the Claude review pass (needs ANTHROPIC_API_KEY secret)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # ETag/Last-Modified cache survives between runs → unchanged feeds cost a 304.
      - uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Scrape, enrich, score, report
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          args="--llm-max ${{ vars.LLM_MAX_PER_RUN || 25 }}"
          if [ -n "${{ inputs.sources }}" ]; then args="$args --sources ${{ inputs.sources }}"; fi
          if [ "${{ inputs.llm }}" = "false" ]; then args="$args --no-llm"; fi
          [ -n "$CLAUDE_MODEL" ] || unset CLAUDE_MODEL
          python -m signal_collector $args

      - name: Archive daily report
        run: |
          mkdir -p reports/archive
          cp reports/latest.md "reports/archive/$(date -u +%Y-%m-%d).md"
          { echo "## Latest run"; head -n 3 reports/latest.md | tail -n 1; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data
        run: |
          git config user.name "signal-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: collect $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase -X theirs
          done
          exit 1
